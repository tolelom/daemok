<title>daemok 설계 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ground: #ECEFEA; --surface: #FAFBF8; --surface-2: #E3E7E0; --band: #F1F3EE; --code-bg: #F4F6F2;
  --ink: #18202B; --ink-2: #485362; --ink-3: #6F7985;
  --line: #CDD2CA; --line-strong: #9CA59D; --edge: #8E978F;
  --accent: #2B55C9; --accent-soft: #DCE4F9; --on-accent: #FFFFFF;
  --add: #2A8753; --add-soft: #DCF0E3; --rem: #C0392F; --rem-soft: #F7DDDA; --chg: #A87210; --chg-soft: #F5EACB;
  --err: #C0392F; --warn: #A87210; --info: #56687F; --ok: #2A8753;
  --k-kw: #7A3EB1; --k-str: #2A8753; --k-com: #7A8490; --k-num: #A8560F;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #10141A; --surface: #171C24; --surface-2: #212833; --band: #141920; --code-bg: #13171E;
    --ink: #E3E7ED; --ink-2: #A9B2BE; --ink-3: #828C99; --line: #2D3541; --line-strong: #4B5563; --edge: #5E6875;
    --accent: #88A6FF; --accent-soft: #1F2C4E; --on-accent: #0E1422;
    --add: #5CC08A; --add-soft: #163525; --rem: #EF7B72; --rem-soft: #3F1E1C; --chg: #DDAE48; --chg-soft: #3A2E13;
    --err: #EF7B72; --warn: #DDAE48; --info: #97A8BF; --ok: #5CC08A;
    --k-kw: #C39BF0; --k-str: #7FD1A0; --k-com: #6F7A88; --k-num: #E8A869;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #10141A; --surface: #171C24; --surface-2: #212833; --band: #141920; --code-bg: #13171E;
  --ink: #E3E7ED; --ink-2: #A9B2BE; --ink-3: #828C99; --line: #2D3541; --line-strong: #4B5563; --edge: #5E6875;
  --accent: #88A6FF; --accent-soft: #1F2C4E; --on-accent: #0E1422;
  --add: #5CC08A; --add-soft: #163525; --rem: #EF7B72; --rem-soft: #3F1E1C; --chg: #DDAE48; --chg-soft: #3A2E13;
  --err: #EF7B72; --warn: #DDAE48; --info: #97A8BF; --ok: #5CC08A;
  --k-kw: #C39BF0; --k-str: #7FD1A0; --k-com: #6F7A88; --k-num: #E8A869;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); }

.app { max-width: 1760px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 28px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font: 600 17px var(--mono); margin: 0; letter-spacing: -0.01em; }
.tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button b { font-family: var(--mono); font-weight: 600; margin-right: 5px; color: var(--ink-3); }
.seg button[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
.seg button[aria-current="true"] b { color: var(--on-accent); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg.sample button { font-family: var(--mono); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-family: var(--mono); font-size: 13px; }
.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; color: var(--accent); }
.crumbs button:hover { background: var(--accent-soft); }
.crumbs button[aria-current="true"] { color: var(--ink); cursor: default; background: none; font-weight: 600; }
.crumbs .sep { color: var(--ink-3); }

.grid { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(320px, 380px); gap: 14px; margin-top: 14px; align-items: start; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.pane-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.pane-h strong { color: var(--ink); font-weight: 600; font-size: 13px; }
.editor textarea { display: block; width: 100%; height: calc(100vh - 230px); min-height: 440px; resize: vertical; border: 0; outline: 0; padding: 12px; background: var(--code-bg); color: var(--ink); font-family: var(--mono); font-size: 12px; line-height: 1.6; tab-size: 2; white-space: pre; }
.editor textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.editor.bad textarea { box-shadow: inset 3px 0 0 var(--err); }
.parse-err { margin: 0; padding: 8px 12px; font-family: var(--mono); font-size: 12px; color: var(--err); border-top: 1px solid var(--line); white-space: pre-wrap; }
.try { margin: 0; padding: 10px 12px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); line-height: 1.6; }
.try code { background: var(--surface-2); padding: 1px 4px; border-radius: 3px; font-size: 11.5px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
.linkbtn:hover { text-decoration: underline; }

.map-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding: 12px 14px 8px; }
.map-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.map-h h2 .lv { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
.map-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--edge); }
.legend i.bad { border-color: var(--err); } .legend i.exc { border-top: 2px dashed var(--warn); }
.legend i.add { border-color: var(--add); } .legend i.rem { border-top: 2px dashed var(--rem); } .legend i.chg { border-color: var(--chg); }
.canvas { overflow-x: auto; padding: 0 6px 6px; }
.canvas svg { display: block; width: 100%; min-width: 760px; height: auto; }
.hint { margin: 0; padding: 8px 14px 12px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); }

.band rect { fill: var(--band); }
.band text { font: 500 11px var(--sans); fill: var(--ink-3); letter-spacing: .08em; }
.frame rect { fill: none; stroke: var(--ink-3); stroke-dasharray: 3 4; stroke-width: 1.2; }
.frame text { font: 500 12px var(--mono); fill: var(--ink-2); }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3; transition: opacity .15s; }
.edge.k-bad { stroke: var(--err); stroke-width: 2; }
.edge.k-exc { stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 6 4; }
.edge.e-add { stroke: var(--add); stroke-width: 2.2; }
.edge.e-rem { stroke: var(--rem); stroke-width: 1.6; stroke-dasharray: 4 4; }
.edge.hi { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
.ah-dep { fill: var(--edge); } .ah-hi { fill: var(--accent); } .ah-bad { fill: var(--err); } .ah-exc { fill: var(--warn); } .ah-add { fill: var(--add); } .ah-rem { fill: var(--rem); }
.node { cursor: pointer; outline: none; transition: opacity .15s; }
.node .box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; }
.node .stack { fill: var(--surface-2); stroke: var(--line-strong); stroke-width: 1; }
.node .lbl { font: 600 13px var(--mono); fill: var(--ink); }
.node .sub { font: 400 11.5px var(--sans); fill: var(--ink-2); }
.t-actor .box { fill: var(--surface-2); }
.t-iface .box { stroke: var(--accent); } .t-iface .lbl { fill: var(--accent); }
.t-sys .box { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; } .t-sys .lbl { font-size: 15px; }
.drill rect { fill: var(--accent); } .drill text { font: 600 11px var(--sans); fill: var(--on-accent); } .drill:hover rect { opacity: .85; }
.node.sel .box, .node:focus-visible .box { stroke: var(--accent); stroke-width: 2.6; }
.st-add .box { fill: var(--add-soft); stroke: var(--add); stroke-width: 2; }
.st-chg .box { fill: var(--chg-soft); stroke: var(--chg); stroke-width: 2; }
.st-rem .box { fill: var(--rem-soft); stroke: var(--rem); stroke-dasharray: 5 4; }
.st-rem .lbl { text-decoration: line-through; fill: var(--rem); }
.stmark { font: 700 11px var(--mono); }
.st-add .stmark { fill: var(--add); } .st-chg .stmark { fill: var(--chg); } .st-rem .stmark { fill: var(--rem); }
.dot-err { fill: var(--err); } .dot-warn { fill: var(--warn); }
svg.focus .edge:not(.hi) { opacity: .1; }
svg.focus .node:not(.near) { opacity: .42; }

/* HTML views (R, L3) */
.hview { padding: 4px 14px 14px; display: grid; gap: 10px; }
.summary-row { display: flex; flex-wrap: wrap; gap: 6px; }
.req { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; background: var(--surface); cursor: pointer; text-align: left; }
.req:hover { border-color: var(--line-strong); }
.req.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.req-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.req-top b { font-family: var(--mono); font-size: 13px; }
.req p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.st-ind { font: 700 11px var(--mono); }
.req.st-add, .l3item.st-add { background: var(--add-soft); }
.req.st-chg, .l3item.st-chg { background: var(--chg-soft); }
.modcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.modcard { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.modcard-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 8px; padding: 9px 11px; border-bottom: 1px solid var(--line); background: var(--band); border-radius: 8px 8px 0 0; }
.modcard-h button { border: 0; background: none; padding: 0; cursor: pointer; font: 600 13px var(--mono); color: var(--ink); }
.modcard-h button:hover { color: var(--accent); }
.modcard-h span { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.l3sec { padding: 6px 11px 8px; display: grid; gap: 3px; }
.l3sec + .l3sec { border-top: 1px dashed var(--line); }
.l3sec h4 { margin: 2px 0; font-size: 10.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .08em; }
.l3item { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 3px 5px; border-radius: 4px; cursor: pointer; text-align: left; min-width: 0; }
.l3item:hover { background: var(--band); }
.l3item.sel { background: var(--accent-soft); }
.l3item b { font: 500 12.5px var(--mono); overflow-wrap: anywhere; }
.l3item small { font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.l3item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.dot.err { background: var(--err); } .dot.warn { background: var(--warn); }
.focus-link:focus-visible, .req:focus-visible, .l3item:focus-visible, .modcard-h button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* side */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.card h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -2px -12px 10px; padding-inline: 8px; }
.tabs button { border: 0; background: none; padding: 7px 9px; font-size: 12.5px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button .n { font-family: var(--mono); font-size: 11px; margin-left: 3px; color: var(--ink-3); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.diff-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-family: var(--mono); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.add, .pill.ok { background: var(--add-soft); color: var(--add); }
.pill.rem, .pill.err { background: var(--rem-soft); color: var(--rem); }
.pill.chg, .pill.warn { background: var(--chg-soft); color: var(--chg); }
.pill.mute { background: var(--surface-2); color: var(--ink-2); }
.diff-list { margin: 0 0 10px; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; display: grid; gap: 2px; }
.diff-list .add { color: var(--add); } .diff-list .rem { color: var(--rem); } .diff-list .chg { color: var(--chg); }
.muted { color: var(--ink-3); font-size: 12px; line-height: 1.55; margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:hover { filter: brightness(1.05); }
.btn:focus-visible, .ref:focus-visible, .issue:focus-visible, .filebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.insp-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.insp-title b { font-family: var(--mono); font-size: 15px; overflow-wrap: anywhere; }
.kind { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.insp-sum { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
dl.kv { margin: 0; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 6px 8px; font-size: 12.5px; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; align-items: baseline; }
.ref { border: 1px solid var(--line); background: var(--code-bg); border-radius: 4px; padding: 1px 6px; font-family: var(--mono); font-size: 12px; cursor: pointer; color: var(--accent); }
.ref:hover { border-color: var(--accent); }
.ref.plain { cursor: default; color: var(--ink-2); }
.codepath { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
.none { color: var(--ink-3); }
.drill-btn { margin-top: 12px; width: 100%; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table.mini { border-collapse: collapse; font-size: 12px; width: 100%; }
table.mini th, table.mini td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.mini th { font-weight: 600; color: var(--ink-3); font-size: 11px; }
table.mini td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.mini td.bad { color: var(--err); font-weight: 600; }
.files { display: grid; gap: 8px; }
.filebtn { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; border: 1px solid var(--line); background: var(--band); border-radius: 6px 6px 0 0; padding: 6px 9px; cursor: pointer; text-align: left; }
.filebtn span { font: 500 12px var(--mono); overflow-wrap: anywhere; }
.filebtn em { font-style: normal; font-size: 11px; color: var(--ink-3); font-family: var(--mono); flex: none; }
.filebtn[aria-expanded="false"] { border-radius: 6px; }
pre.code { margin: 0; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px; background: var(--code-bg); padding: 10px; font: 11.5px/1.55 var(--mono); overflow-x: auto; white-space: pre; color: var(--ink); max-height: 420px; }
.tok-kw { color: var(--k-kw); } .tok-str { color: var(--k-str); } .tok-com { color: var(--k-com); font-style: italic; } .tok-num { color: var(--k-num); }
.issues { display: grid; gap: 3px; }
.issue { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 0; background: none; padding: 5px 4px; border-radius: 5px; cursor: pointer; font-size: 12.5px; line-height: 1.45; }
.issue:hover { background: var(--band); }
.issue.static { cursor: default; }
.issue.static:hover { background: none; }
.issue code { font-size: 11.5px; overflow-wrap: anywhere; }
.sev { font-size: 10.5px; font-weight: 600; text-align: center; border-radius: 4px; padding: 1px 0; }
.sev.err { background: var(--rem-soft); color: var(--err); }
.sev.warn { background: var(--chg-soft); color: var(--warn); }
.sev.info { background: var(--surface-2); color: var(--info); }
.sev.ok { background: var(--add-soft); color: var(--ok); }
.note { font-size: 11.5px; color: var(--ink-3); margin: 0 0 8px; line-height: 1.5; }

@media (max-width: 1240px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); }
  .editor { grid-column: 1 / -1; order: 3; }
  .editor textarea { height: 480px; }
}
@media (max-width: 780px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .side { order: 2; }
}
@media (prefers-reduced-motion: reduce) { .edge, .node { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M2 8 L13 3 L24 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><rect x="4" y="9" width="18" height="3" rx="1" fill="currentColor"/><rect x="6" y="13" width="2.4" height="10" fill="currentColor"/><rect x="17.6" y="13" width="2.4" height="10" fill="currentColor"/><rect x="11.8" y="13" width="2.4" height="10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <h1>daemok</h1>
      <span class="tag">프로토타입 v2</span>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
const SAMPLES = {
tolchain: {
file: 'tolchain.design.yaml',
tries: [
  '<code>economy</code>의 <code>handles</code>에서 <code>transfer</code>를 지우면 처리하는 모듈이 없는 트랜잭션 타입이 에러로 잡혀요.',
  '<code>market</code>의 <code>handles</code>에 <code>transfer</code>를 넣으면 중복 등록 에러가 나요. 지금 코드에서는 노드 시작 시 panic이에요.',

text: `version: 0.2
go_module: github.com/tolelom/tolchain

# ── R 요구사항 (예시 값) ──
requirements:
  REQ-transfer:    { text: "사용자는 토큰을 다른 주소로 보낼 수 있다", status: active }
  REQ-reward:      { text: "게임 서버는 보상을 한 트랜잭션으로 모아 지급한다", status: active }
  REQ-delegation:  { text: "API 서버는 위임받은 범위 안에서 유저 대신 서명한다", status: active }
  REQ-random:      { text: "게임 난수는 commit-reveal로 조작을 막는다", status: held }

# ── L0 시스템 ──
system:
  id: tolchain
  summary: 게임 특화 PoA 프라이빗 블록체인
  actors:
    game_server: { summary: "게임 결과를 서명된 트랜잭션으로 제출" }
    api_server:  { summary: "커스터디얼 지갑으로 유저 대신 서명" }
    peer_node:   { summary: "다른 tolchain 노드" }
    monitoring:  { summary: "Prometheus + Grafana" }
  interfaces:
    json_rpc: { protocol: jsonrpc2-http, port: 8545,     used_by: [game_server, api_server] }
    events:   { protocol: sse,           path: /events,  used_by: [game_server, api_server] }
    p2p:      { protocol: tcp-lpjson,    port: 30303,    used_by: [peer_node] }
    metrics:  { protocol: prometheus,    path: /metrics, used_by: [monitoring] }

# ── L1 실행 단위 ──
executables:
  node:
    summary: 검증자 / 풀 노드
    exposes: [json_rpc, events, p2p, metrics]
    composes: [config, consensus, rpc, network, storage, indexer, wallet, certgen, vm, tx_modules]
  genkey: { summary: 검증자 키 생성, composes: [] }
  backup: { summary: LevelDB 백업, composes: [storage] }

# ── L2 모듈 ──
tiers: [foundation, domain, persistence, execution, service]

modules:
  crypto:    { tier: foundation,  summary: "ed25519 서명, SHA-256" }
  certgen:   { tier: foundation,  summary: "mTLS 인증서 생성", path: crypto/certgen }
  events:    { tier: foundation,  summary: "이벤트 pub/sub" }
  metrics:   { tier: foundation,  summary: "Prometheus 지표", implements: [metrics] }
  core:      { tier: domain,      summary: "Transaction, Block, State, Mempool", depends_on: [crypto, metrics] }
  storage:   { tier: persistence, summary: "LevelDB + 스냅샷/롤백", depends_on: [core, crypto] }
  indexer:   { tier: persistence, summary: "owner→assets 보조 인덱스", depends_on: [core, events, storage] }
  vm:        { tier: execution,   summary: "트랜잭션 실행 엔진", depends_on: [core, crypto, events] }
  consensus: { tier: service, summary: "PoA 라운드로빈", depends_on: [config, core, crypto, events, metrics, vm] }
  network:   { tier: service, summary: "TCP P2P", depends_on: [core, events, metrics], implements: [p2p] }
  rpc:       { tier: service, summary: "JSON-RPC + SSE", depends_on: [core, events, indexer, metrics], implements: [json_rpc, events] }
  wallet:    { tier: service, summary: "키스토어, Tx 빌더", depends_on: [core, crypto] }
  config:    { tier: service, summary: "설정, 제네시스, TLS", depends_on: [core] }

groups:
  tx_modules:
    tier: execution
    kind: tx_handler
    path: vm/modules
    depends_on: [core, crypto, events, vm]
    rule: no_sibling_deps
    members:
      economy:    { summary: "토큰 전송", handles: [transfer], satisfies: [REQ-transfer] }
      asset:      { summary: "템플릿, 발행/소각/전송", handles: [mint_asset, burn_asset, transfer_asset, register_template] }
      market:     { summary: "마켓 등록/구매/취소", handles: [list_market, buy_market, cancel_listing] }
      session:    { summary: "게임 세션", handles: [session_open, session_result, session_cancel] }
      inventory:  { summary: "장착 슬롯", handles: [equip_item, unequip_item] }
      random:     { summary: "commit-reveal 난수", handles: [random_commit, random_reveal], satisfies: [REQ-random] }
      delegation: { summary: "서명 위임", handles: [grant_delegation, revoke_delegation], satisfies: [REQ-delegation] }
      reward:
        summary: "배치 보상 (토큰 + 자산)"
        handles: [grant_reward]
        satisfies: [REQ-reward]
        exceptions:
          - depends_on: asset
            reason: "보상 지급 시 자산 스키마 검증 재사용"

# ── L3 타입·계약 ──
enums:
  tx_type:
    in: core
    go: { type: TxType, prefix: Tx }
    values: [transfer, mint_asset, burn_asset, transfer_asset, register_template,
             session_open, session_result, list_market, buy_market, cancel_listing,
             session_cancel, equip_item, unequip_item, grant_reward,
             random_commit, random_reveal, grant_delegation, revoke_delegation]

consts:
  max_block_txs: { in: config, type: int, value: 500, go: { name: DefaultMaxBlockTxs } }
  max_tx_age:    { in: config, type: duration, value: 1h, go: { name: MaxTxAge } }

errors:
  ErrNotFound:            { in: core, message: "not found" }
  ErrInsufficientBalance: { in: core, message: "insufficient balance" }
  ErrInvalidNonce:        { in: core, message: "invalid nonce" }
  ErrBalanceOverflow:     { in: core, message: "balance overflow" }
  ErrNonceOverflow:       { in: core, message: "nonce overflow" }
  ErrAlreadyExists:       { in: core, message: "already exists" }
  ErrUnauthorized:        { in: core, message: "unauthorized" }

types:
  transfer_payload:
    in: core
    fields: { to: address, amount: uint64 }

handler_kinds:
  tx_handler:
    in: vm
    go: { name: Handler, register: Register }
    params: { ctx: "*Context", payload: json.RawMessage }
    returns: [error]
    key: tx_type

# ── L4 함수 계약 ──
funcs:
  handle_transfer:
    in: economy
    kind: tx_handler
    handles: transfer
    satisfies: [REQ-transfer]
    errors: [ErrInsufficientBalance, ErrUnauthorized, ErrBalanceOverflow]
    cases:
      - { name: "금액 0",         given: { amount: 0 },                         error: invalid }
      - { name: "잔액 부족",      given: { balance: 5, amount: 10 },            error: ErrInsufficientBalance }
      - { name: "위임 한도 초과", given: { delegated_max: 5, amount: 10 },      error: ErrUnauthorized }
      - { name: "정상 이체",      given: { balance: 10, amount: 3 },            expect: { from: 7, to: 3 } }
`},

text: `version: 0.2
go_module: github.com/tolelom/fiber_api_server
ts_out: tolelog/src/generated/design.gen.ts

# ── R 요구사항 (예시 값) ──
requirements:
  REQ-draft:   { text: "작성자는 글을 임시저장하고 본인만 볼 수 있다", status: active }
  REQ-series:  { text: "글을 시리즈로 묶어 순서대로 읽을 수 있다", status: active }
  REQ-search:  { text: "제목과 본문으로 공개 글을 검색한다", status: active }
  REQ-oauth:   { text: "GitHub 계정으로 로그인한다", status: active }

# ── L0 시스템 ──
system:
  id: tolelog
  summary: 개인 기술 블로그
  actors:

    author:  { summary: "글 작성자" }

executables:
  server:
    summary: Fiber API 서버
    exposes: [rest_api, feed, sitemap]
    composes: [router]

# ── L2 모듈 ──
tiers: [foundation, domain, support, service, transport]

modules:

  httputil:   { tier: support,    summary: "페이지네이션 파라미터" }
  post:       { tier: service,    summary: "게시글, 좋아요, 검색", path: internal/post, depends_on: [model, utils, dto], satisfies: [REQ-draft, REQ-search] }
  comment:    { tier: service,    summary: "댓글", depends_on: [model] }
  user:       { tier: service,    summary: "회원, 인증", depends_on: [model, utils] }
  series:     { tier: service,    summary: "시리즈", depends_on: [model], satisfies: [REQ-series] }
  tag:        { tier: service,    summary: "태그", depends_on: [model] }
  image:      { tier: service,    summary: "이미지 저장", depends_on: [upload] }
  feed:       { tier: service,    summary: "RSS", depends_on: [post], implements: [feed] }
  sitemap:    { tier: service,    summary: "sitemap.xml", depends_on: [model], implements: [sitemap] }
  dto:        { tier: transport,  summary: "요청/응답 DTO", path: internal/dto, depends_on: [model, utils] }
  middleware: { tier: transport,  summary: "인증, rate limit", depends_on: [config] }
  router:
    tier: transport
    summary: "라우트 등록, DI"
    implements: [rest_api]
    depends_on: [post, comment, user, series, tag, image, feed, sitemap, dto, middleware, httputil]

# ── L3 타입·계약 ──
enums:
  post_status:
    in: model
    go: { type: PostStatus }
    values: [published, draft]
    export: [ts]
    satisfies: [REQ-draft]

consts:
  page_size_default:      { in: httputil, type: int, value: 10,      export: [ts] }
  page_size_max:          { in: httputil, type: int, value: 100 }
  post_title_max:         { in: dto,      type: int, value: 255,     export: [ts] }
  post_content_max:       { in: dto,      type: int, value: 500000,  export: [ts] }
  series_title_max:       { in: dto,      type: int, value: 255,     export: [ts] }
  series_description_max: { in: dto,      type: int, value: 2000,    export: [ts] }
  image_max_bytes:        { in: upload,   type: int, value: 5242880, export: [ts] }
  access_token_ttl:       { in: utils,    type: duration, value: 15m }
  refresh_token_ttl:      { in: utils,    type: duration, value: 168h }

errors:
  ErrPostNotFound:       { in: post, message: "post not found",        http: 404 }
  ErrUnauthorized:       { in: post, message: "unauthorized",          http: 403 }
  ErrNoFieldsToUpdate:   { in: post, message: "no fields to update",   http: 400 }
  ErrInvalidSearchQuery: { in: post, message: "invalid search query",  http: 400 }

types:
  user:   { in: model, fields: { username: string } }
  tag:    { in: model, fields: { name: string } }
  series: { in: model, fields: { title: { type: string, max: series_title_max } } }
  post:
    in: model
    fields:
      title:      { type: string, max: post_title_max }
      content:    { type: string, max: post_content_max }
      is_public:  bool
      status:     post_status
      author:     { ref: user }
      tags:       { ref: tag, many: true }
      series:     { ref: series, optional: true }
      view_count: uint
  update_post_request:
    in: dto
    fields:
      title:   { type: string, max: post_title_max, optional: true }
      content: { type: string, max: post_content_max, optional: true }
      status:  { type: post_status, optional: true }

contracts:
  post_service:
    in: post
    go: { name: Service }
    methods:
      get_post_by_id: { params: { post_id: uint, user_id: "*uint" }, returns: [post], errors: [ErrPostNotFound] }
      update_post:    { params: { post_id: uint, user_id: uint, req: update_post_request }, returns: [post], errors: [ErrPostNotFound, ErrUnauthorized, ErrNoFieldsToUpdate] }
      delete_post:    { params: { post_id: uint, user_id: uint }, returns: [], errors: [ErrPostNotFound, ErrUnauthorized] }

# ── L4 함수 계약 ──
funcs:
  update_post:
    in: post
    of: post_service.update_post
    errors: [ErrPostNotFound, ErrUnauthorized, ErrNoFieldsToUpdate]
    cases:
      - { name: "없는 글",   given: { post: null },                  error: ErrPostNotFound }
      - { name: "남의 글",   given: { owner: 2, user: 1 },           error: ErrUnauthorized }
      - { name: "변경 없음", given: { owner: 1, user: 1, req: {} },  error: ErrNoFieldsToUpdate }
      - { name: "제목 수정", given: { owner: 1, user: 1, req: { title: "새 제목" } }, expect: { title: "새 제목" } }
`}
};

const STORE = 'daemok-proto-v2';
const W = 1000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
const arr = v => Array.isArray(v) ? v.map(String) : (v == null ? [] : [String(v)]);
const camel = s => String(s).split(/[_\-]/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join('');
const lcamel = s => { const c = camel(s); return c ? c[0].toLowerCase() + c.slice(1) : c; };
const goIdent = s => { const c = lcamel(s); return c.replace(/Id$/, 'ID').replace(/Id([A-Z])/g, 'ID$1'); };
const goExport = s => camel(s).replace(/Id$/, 'ID').replace(/Id([A-Z])/g, 'ID$1');

/* ---------- model ---------- */
function parseFields(f) {
  return Object.entries(obj(f)).map(([name, v]) => {
    if (typeof v === 'string' || typeof v === 'number') return { name, type: String(v) };
    const o = obj(v);
    return { name, type: o.type ? String(o.type) : '', ref: o.ref ? String(o.ref) : '', many: !!o.many, optional: !!o.optional, max: o.max != null ? String(o.max) : '' };
  });
}
function parseParams(p) { return Object.entries(obj(p)).map(([name, t]) => ({ name, type: String(t) })); }

function normalize(d) {
  d = obj(d);
  const sys = obj(d.system);
  const m = {
    goModule: String(d.go_module || 'example.com/app'), tsOut: d.ts_out ? String(d.ts_out) : '',
    system: { id: String(sys.id || 'system'), summary: sys.summary || '' },
    actors: {}, ifaces: {}, exes: {}, mods: {}, groups: {}, members: {}, tiers: arr(d.tiers),
    reqs: {}, enums: {}, consts: {}, errors: {}, types: {}, contracts: {}, hks: {}, funcs: {}
  };
  for (const [id, v0] of Object.entries(obj(d.requirements))) { const v = obj(v0); m.reqs[id] = { id, text: v.text || '', status: String(v.status || 'active') }; }
  for (const [id, v] of Object.entries(obj(sys.actors))) m.actors[id] = { id, summary: obj(v).summary || '' };
  for (const [id, v0] of Object.entries(obj(sys.interfaces))) { const v = obj(v0); m.ifaces[id] = { id, protocol: v.protocol || '', port: v.port ?? null, path: v.path ?? null, spec: v.spec || '', used_by: arr(v.used_by) }; }
  for (const [id, v0] of Object.entries(obj(d.executables))) { const v = obj(v0); m.exes[id] = { id, summary: v.summary || '', exposes: arr(v.exposes), composes: arr(v.composes) }; }
  for (const [id, v0] of Object.entries(obj(d.modules))) { const v = obj(v0); m.mods[id] = { id, type: 'mod', tier: v.tier ? String(v.tier) : '', summary: v.summary || '', path: String(v.path || id), depends_on: arr(v.depends_on), implements: arr(v.implements), satisfies: arr(v.satisfies) }; }
  for (const [gid, g0] of Object.entries(obj(d.groups))) {
    const g = obj(g0);
    const grp = { id: gid, type: 'grp', tier: g.tier ? String(g.tier) : '', summary: g.summary || '', kind: g.kind ? String(g.kind) : '', rule: g.rule || '', path: String(g.path || gid), depends_on: arr(g.depends_on), implements: arr(g.implements), satisfies: arr(g.satisfies), members: [] };
    for (const [mid, x0] of Object.entries(obj(g.members))) {
      const x = obj(x0);
      const exceptions = (Array.isArray(x.exceptions) ? x.exceptions : []).map(e => ({ to: String(obj(e).depends_on || ''), reason: obj(e).reason || '' }));
      m.members[mid] = { id: mid, type: 'mem', group: gid, summary: x.summary || '', path: grp.path + '/' + mid, exceptions, handles: arr(x.handles), satisfies: arr(x.satisfies) };
      grp.members.push(mid);
    }
    m.groups[gid] = grp;
  }
  for (const [id, v0] of Object.entries(obj(d.enums))) { const v = obj(v0); m.enums[id] = { id, in: String(v.in || ''), values: arr(v.values), go: obj(v.go), export: arr(v.export), satisfies: arr(v.satisfies) }; }
  for (const [id, v0] of Object.entries(obj(d.consts))) { const v = obj(v0); m.consts[id] = { id, in: String(v.in || ''), type: String(v.type || 'int'), value: v.value, go: obj(v.go), export: arr(v.export), satisfies: arr(v.satisfies) }; }
  for (const [id, v0] of Object.entries(obj(d.errors))) { const v = obj(v0); m.errors[id] = { id, in: String(v.in || ''), message: v.message || '', http: v.http ?? null, satisfies: arr(v.satisfies) }; }
  for (const [id, v0] of Object.entries(obj(d.types))) { const v = obj(v0); m.types[id] = { id, in: String(v.in || ''), fields: parseFields(v.fields), go: obj(v.go), satisfies: arr(v.satisfies) }; }
  for (const [id, v0] of Object.entries(obj(d.contracts))) {
    const v = obj(v0);
    m.contracts[id] = { id, in: String(v.in || ''), go: obj(v.go), satisfies: arr(v.satisfies),
      methods: Object.entries(obj(v.methods)).map(([name, mm0]) => { const mm = obj(mm0); return { name, params: parseParams(mm.params), returns: arr(mm.returns), errors: arr(mm.errors), hasErrors: 'errors' in mm }; }) };
  }

  } else if (tab === 'checks') {
    const list = sel ? mine : issues;
    body = list.length ? `<div class="issues">${list.map(issueRow).join('')}</div>` : '<p class="muted">이 요소에는 걸린 검사가 없어요.</p>';
  } else if (!sel) {
    body = `<h3>선택한 요소</h3><p class="muted">지도에서 요소를 누르면 요약, 연결, 생성 코드가 보여요. 선택하지 않은 상태의 <b>생성 코드</b> 탭에는 설계 전체에서 나오는 파일 ${files.length}개가 있어요.</p>`;
  } else {
    const [type, ...rest] = sel.split(':'); const id = rest.join(':');
    let r = overviewRows(type, id, model), removed = false;
    if (!r) { r = overviewRows(type, id, baseModel); removed = true; }
    if (!r) { sel = null; return renderInspector(); }
    body = `<div class="insp-title"><b>${esc(id)}</b><span class="kind">${KLABEL[type] || type}${removed ? ' · 삭제됨' : ''}</span></div>${r.sum ? `<p class="insp-sum">${esc(r.sum)}</p>` : ''}<dl class="kv">${r.rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${r.extra}${r.drill && !removed ? `<button type="button" class="btn primary drill-btn" data-drillto='${esc(JSON.stringify(r.drill))}'>한 계층 아래로 열기</button>` : ''}`;
  }
  box.innerHTML = tabs + body;
}
const LV = { err: '오류', warn: '경고', info: '예외', ok: '일치' };
const issueRow = i => `<button type="button" class="issue" data-issue="${issues.indexOf(i)}"><span class="sev ${i.lv}">${LV[i.lv]}</span><span>${esc(i.msg)}</span></button>`;
function renderIssues() {
  const c = { err: 0, warn: 0, info: 0 }; issues.forEach(i => c[i.lv]++);
  const snap = SNAPSHOT[state.sample] || [];
  const tabs = `<div class="tabs" role="tablist"><button type="button" role="tab" data-itab="design" aria-selected="${issueTab === 'design'}">설계 검사<span class="n">${c.err}·${c.warn}·${c.info}</span></button><button type="button" role="tab" data-itab="code" aria-selected="${issueTab === 'code'}">코드 대조<span class="n">${snap.length}</span></button></div>`;
  let body;
  if (issueTab === 'design') body = `<div class="summary-row" style="margin-bottom:8px"><span class="pill err">오류 ${c.err}</span><span class="pill warn">경고 ${c.warn}</span><span class="pill mute">예외 ${c.info}</span></div>` + (issues.length ? `<div class="issues">${issues.map(issueRow).join('')}</div>` : '<p class="muted">규칙 위반이 없어요.</p>');
  else body = `<p class="note">실제 저장소에서 설계와 코드를 맞춰본 결과예요. 프로토타입은 코드를 직접 읽지 않아서 저장소 스냅샷 기준으로 고정돼 있어요.</p><div class="issues">${snap.map(s => `<div class="issue static"><span class="sev ${s.lv}">${LV[s.lv]}</span><span>${s.msg}</span></div>`).join('')}</div>`;
  $('#issuesBox').innerHTML = tabs + body;
}
function renderDiff() {
  const list = diffList();
  const n = t => list.filter(x => x[0] === t).length;
  const box = $('#diffBox');
  if (!list.length && curText() === curBase()) { box.innerHTML = `<h3>기준 대비 변경</h3><div class="diff-counts"><span class="pill mute">변경 없음</span><span class="pill mute">생성 파일 ${files.length}</span></div><p class="muted">설계 파일을 고치면 바뀐 요소가 지도와 목록에 색으로 표시돼요. 승인하면 새 기준이 돼요.</p>`; return; }
  const sym = { add: '+', rem: '−', chg: '~' };
  box.innerHTML = `<h3>기준 대비 변경</h3><div class="diff-counts"><span class="pill add">+${n('add')} 추가</span><span class="pill rem">−${n('rem')} 삭제</span><span class="pill chg">~${n('chg')} 수정</span></div>${list.length ? `<ul class="diff-list">${list.slice(0, 8).map(([t, k]) => `<li class="${t}">${sym[t]} ${esc(k)}</li>`).join('')}${list.length > 8 ? `<li class="none">외 ${list.length - 8}개</li>` : ''}</ul>` : '<p class="muted" style="margin-bottom:10px">구조 변화 없이 텍스트만 바뀌었어요.</p>'}<div class="actions"><button type="button" class="btn primary" id="approve">변경 승인</button><button type="button" class="btn" id="revert">되돌리기</button></div>`;
}
function renderAll() { renderChrome(); renderMap(); renderInspector(); renderIssues(); renderDiff(); }

/* ---------- navigation ---------- */
function drill(d) { if (!d) return; nav = nav.concat(d); sel = null; hover = null; renderAll(); }
function goto(key) {
  const [type, ...rest] = key.split(':'); const id = rest.join(':');
  const l2 = nav.find(n => n.level === 'L2') || { level: 'L2' };
  if (type === 'req') nav = [{ level: 'R' }];
  else if (L3KINDS.includes(type)) nav = [{ level: 'L3' }];
  else if (type === 'actor' || type === 'iface' || type === 'sys') nav = [{ level: 'L0' }];
  else if (type === 'exe') nav = [{ level: 'L0' }, { level: 'L1' }];
  else if (type === 'mod' || type === 'grp') nav = [{ level: 'L0' }, { level: 'L1' }, closure(model, l2.exe).has(id) ? l2 : { level: 'L2' }];
  else if (type === 'mem') { const x = model.members[id] || baseModel.members[id]; if (x) nav = [{ level: 'L0' }, { level: 'L1' }, l2, { level: 'G', group: x.group }]; }
  sel = key; hover = null; renderAll();
  const el = document.querySelector(`[data-key="${CSS.escape(key)}"], [data-sel="${CSS.escape(key)}"]`);
  if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' }); }
}
function switchSample(k) { state.sample = k; save(); src.value = curText(); model = null; loadBase(); nav = [{ level: 'L0' }]; sel = null; tab = 'overview'; openFiles.clear(); parse(); renderAll(); }

/* ---------- events ---------- */
const src = $('#src');
let timer;
src.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { state.texts[state.sample] = src.value; save(); parse(); renderAll(); }, 180); });
src.addEventListener('keydown', e => { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const { selectionStart: a, selectionEnd: b } = src; src.setRangeText('  ', a, b, 'end'); src.dispatchEvent(new Event('input')); } });
$('#resetSample').addEventListener('click', () => { delete state.texts[state.sample]; delete state.bases[state.sample]; save(); src.value = curText(); model = null; loadBase(); parse(); renderAll(); });

const canvas = $('#canvas');
const nodeOf = t => t.closest && t.closest('.node');
const findNode = key => merged(curNav()).nodes.find(n => n.key === key);
canvas.addEventListener('click', e => {
  if (e.target.closest('[data-go]')) return;
  const s = e.target.closest('[data-sel]');
  if (s) { sel = s.dataset.sel; renderMap(); renderInspector(); const again = document.querySelector(`[data-sel="${CSS.escape(sel)}"]`); if (again) again.focus({ preventScroll: true }); return; }
  const n = nodeOf(e.target);
  if (!n) { if (e.target.closest('svg')) { sel = null; renderMap(); renderInspector(); } return; }
  if (e.target.closest('[data-drill]')) return drill(findNode(n.dataset.key)?.drill);
  sel = n.dataset.key; renderMap(); renderInspector();
  const again = document.querySelector(`.node[data-key="${CSS.escape(sel)}"]`); if (again) again.focus({ preventScroll: true });
});
canvas.addEventListener('dblclick', e => { const n = nodeOf(e.target); if (n) drill(findNode(n.dataset.key)?.drill); });
canvas.addEventListener('keydown', e => {
  const s = e.target.closest && e.target.closest('.req[data-sel]');
  if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sel = s.dataset.sel; renderMap(); renderInspector(); return; }
  const n = nodeOf(e.target); if (!n) return;
  if (e.key === 'Enter') { e.preventDefault(); const d = findNode(n.dataset.key)?.drill; if (d) drill(d); else { sel = n.dataset.key; renderMap(); renderInspector(); } }
  if (e.key === ' ') { e.preventDefault(); sel = n.dataset.key; renderMap(); renderInspector(); }
  if (e.key === 'Backspace' && nav.length > 1) { e.preventDefault(); nav = nav.slice(0, -1); sel = null; renderAll(); }
});
canvas.addEventListener('mouseover', e => { const n = nodeOf(e.target); const k = n ? n.dataset.key : null; if (k !== hover) { hover = k; highlight(hover || sel); } });
canvas.addEventListener('mouseleave', () => { hover = null; highlight(sel); });

document.addEventListener('click', e => {
  const t = e.target;
  const sm = t.closest('[data-sample]'); if (sm) { if (sm.dataset.sample !== state.sample) switchSample(sm.dataset.sample); return; }
  const lv = t.closest('[data-level]');
  if (lv) { const k = lv.dataset.level, l2 = nav.find(n => n.level === 'L2'); nav = k === 'R' ? [{ level: 'R' }] : k === 'L3' ? [{ level: 'L3' }] : k === 'L0' ? [{ level: 'L0' }] : k === 'L1' ? [{ level: 'L0' }, { level: 'L1' }] : [{ level: 'L0' }, { level: 'L1' }, l2 || { level: 'L2' }]; sel = null; renderAll(); return; }
  const cr = t.closest('[data-crumb]'); if (cr) { nav = nav.slice(0, +cr.dataset.crumb + 1); sel = null; renderAll(); return; }
  const go = t.closest('[data-go]'); if (go) { goto(go.dataset.go); return; }
  const dt = t.closest('[data-drillto]'); if (dt) { drill(JSON.parse(dt.dataset.drillto)); return; }
  const tb = t.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; renderInspector(); return; }
  const it = t.closest('[data-itab]'); if (it) { issueTab = it.dataset.itab; renderIssues(); return; }
  const fb = t.closest('[data-file]'); if (fb) { const p = fb.dataset.file; if (openFiles.has(p)) openFiles.delete(p); else openFiles.add(p); renderInspector(); return; }
  const is = t.closest('[data-issue]'); if (is) { const i = issues[+is.dataset.issue]; if (i) { tab = 'checks'; goto(i.key); } return; }
  if (t.id === 'approve') { state.bases[state.sample] = curText(); save(); loadBase(); renderAll(); return; }
  if (t.id === 'revert') { state.texts[state.sample] = curBase(); save(); src.value = curText(); parse(); renderAll(); }
});

src.value = curText();
loadBase();
parse();
renderAll();
</script>
