<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>daemok 설계 지도</title>
<link rel="icon" href="data:,">
<style>
:root {
  --sans: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --ground: #E9EDF1; --paper: #FFFFFF; --paper-2: #F4F6F8; --band: #F1F4F7;
  --ink: #17202B; --ink-2: #4A5563; --ink-3: #7A8491; --line: #D4DAE1; --line-2: #B4BDC7;
  --focus: #2563EB; --add: #15803D; --chg: #B7791F; --rem: #C0392B; --err: #C0392B; --warn: #B7791F; --info: #5B6B80;
  --k-depends: #8A94A1; --k-exception: #B7791F; --k-call: #0E7490; --k-query: #2563EB;
  --k-port: #15803D; --k-external: #7C3AED; --k-event: #DB2777; --k-register: #9A3412;
  --shadow: 0 10px 30px rgba(23, 32, 43, .16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0F141A; --paper: #161C24; --paper-2: #1C232D; --band: #131920;
    --ink: #E4E8EE; --ink-2: #A7B0BC; --ink-3: #7E8896; --line: #2A323D; --line-2: #3D4652;
    --focus: #7AA2FF; --add: #4CC38A; --chg: #E0B252; --rem: #F07A6E; --err: #F07A6E; --warn: #E0B252; --info: #98A7BC;
    --k-depends: #7D8794; --k-exception: #E0B252; --k-call: #3FB6CC; --k-query: #7AA2FF;
    --k-port: #4CC38A; --k-external: #B592FF; --k-event: #F472B6; --k-register: #E08A5E;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 14px/1.55 var(--sans); }
button { font: inherit; color: inherit; }
.id { font-family: var(--mono); font-size: .93em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--line); }
.bar { max-width: 1600px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 700 17px var(--mono); letter-spacing: -.02em; }
.brand span { color: var(--ink-3); font-size: 12.5px; overflow-wrap: anywhere; }
.brand span.bad { color: var(--err); }
nav.tabs { display: flex; gap: 2px; }
nav.tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
nav.tabs button[aria-current="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.issuesbtn { margin-left: auto; display: flex; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.issuesbtn i { font-style: normal; font-family: var(--mono); }
.issuesbtn .e { color: var(--err); } .issuesbtn .w { color: var(--warn); } .issuesbtn .n { color: var(--info); }

main { max-width: 1600px; margin: 0 auto; padding: 16px; }
.lead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; margin-bottom: 12px; }
.lead h1 { margin: 0; font-size: 18px; font-weight: 700; }
.lead p { margin: 2px 0 0; color: var(--ink-2); max-width: 78ch; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.sw { display: inline-block; width: 22px; height: 0; border-top: 2.5px solid var(--c); }
.sw.dash { border-top-style: dashed; } .sw.dot { border-top-style: dotted; }
.k-depends { --c: var(--k-depends); } .k-exception { --c: var(--k-exception); } .k-call { --c: var(--k-call); }
.k-query { --c: var(--k-query); } .k-port { --c: var(--k-port); } .k-external { --c: var(--k-external); }
.k-event { --c: var(--k-event); } .k-register { --c: var(--k-register); }

/* 지도 */
.map { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.map svg { display: block; min-width: 900px; width: 100%; height: auto; }
.map text { fill: var(--ink); font-family: var(--sans); }
.band rect { fill: var(--band); }
.band text { fill: var(--ink-3); font-size: 12px; }
.unit { cursor: pointer; }
.unit rect.box { fill: var(--paper); stroke: var(--line-2); stroke-width: 1.2; }
.unit.grp rect.stack { fill: var(--paper-2); stroke: var(--line-2); }
.unit .nm { font: 600 13.5px var(--mono); }
.unit .sub { font-size: 11.5px; fill: var(--ink-3); }
.unit:hover rect.box, .unit:focus rect.box, .unit.on rect.box { stroke: var(--focus); stroke-width: 2; }
.unit.st-add rect.box { stroke: var(--add); stroke-width: 2; }
.unit.st-chg rect.box { stroke: var(--chg); stroke-width: 2; }
.unit.st-rem rect.box { stroke: var(--rem); stroke-dasharray: 5 4; }
.unit.st-rem .nm { text-decoration: line-through; }
.unit:focus { outline: none; }
.dim .unit:not(.near):not(.on) { opacity: .28; }
.edge { fill: none; stroke: var(--c); stroke-width: 1.8; opacity: 0; transition: opacity .12s; }
.edge.show { opacity: .95; }
.edge.dash { stroke-dasharray: 7 5; } .edge.dot { stroke-dasharray: 2 4; }
.edge-label { font-size: 11px; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; fill: var(--c); opacity: 0; }
.edge-label.show { opacity: 1; }
.issue-dot { r: 4.5; }
.issue-dot.err { fill: var(--err); } .issue-dot.warn { fill: var(--warn); }
.maphint { margin: 8px 2px 0; color: var(--ink-3); font-size: 12.5px; }

/* 모듈 */
.picker { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; }
.picker .tier { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.picker .tier > span { color: var(--ink-3); font-size: 12px; margin-right: 2px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-family: var(--mono); font-size: 12.5px; }
.chip[aria-pressed="true"] { border-color: var(--focus); color: var(--focus); font-weight: 600; }
.chip.st-add { border-color: var(--add); } .chip.st-chg { border-color: var(--chg); }
.three { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.col h2 { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.col .empty { color: var(--ink-3); font-size: 13px; margin: 0; }
.rels { display: grid; gap: 6px; }
.rel { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 7px 10px; display: grid; gap: 2px; }
.rel .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
.rel .kind { font-size: 11.5px; color: var(--c); font-weight: 600; }
.rel .why { font-size: 12.5px; color: var(--ink-2); }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-family: var(--mono); font-size: 13px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover { color: var(--focus); text-decoration-color: currentColor; }
.link.soft { font-weight: 500; color: var(--ink-2); }
.center { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.center h2 { margin: 0; font: 700 20px var(--mono); }
.center .meta { color: var(--ink-3); font-size: 12.5px; }
.center .summary { margin: 0; }
.center h3 { margin: 0 0 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.owned { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.diag { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.diag li { display: flex; gap: 8px; }
.sev { flex: none; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; height: 18px; line-height: 18px; }
.sev.err { color: var(--err); background: color-mix(in srgb, var(--err) 14%, transparent); }
.sev.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.sev.info { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }

/* 흐름 */
.flowgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.flowcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.flow { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.flow h2 { margin: 0; font: 700 16px var(--mono); }
.flow .meta { color: var(--ink-3); font-size: 12.5px; margin-bottom: 10px; }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
ol.steps li { counter-increment: s; position: relative; padding: 7px 8px 7px 38px; border-radius: 7px; cursor: pointer; }
ol.steps li::before { content: counter(s); position: absolute; left: 8px; top: 8px; width: 22px; text-align: right; font: 12px var(--mono); color: var(--ink-3); }
ol.steps li:hover { background: var(--paper-2); }
ol.steps li .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
ol.steps li .step { font: 600 13.5px var(--mono); }
ol.steps li .note { color: var(--ink-3); font-size: 12.5px; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--line); color: var(--ink-2); }
.tag.undo { border-color: var(--k-exception); color: var(--k-exception); }
.tag.fatal { border-color: var(--err); color: var(--err); }
.tag.call { border-color: var(--k-query); color: var(--k-query); cursor: pointer; }
.tag.emit { border-color: var(--k-event); color: var(--k-event); cursor: pointer; }
li.commitline { counter-increment: none; cursor: default !important; padding: 2px 8px 2px 38px !important; }
li.commitline::before { content: none !important; }
li.commitline:hover { background: none !important; }
li.commitline div { border-top: 2px solid var(--add); color: var(--add); font-size: 11.5px; padding-top: 2px; }
ol.steps li.failed { background: color-mix(in srgb, var(--err) 12%, transparent); }
ol.steps li.undone { background: color-mix(in srgb, var(--k-exception) 12%, transparent); }
ol.steps li.skipped { opacity: .35; }
.side { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; position: sticky; top: 70px; }
.side h2 { margin: 0 0 6px; font-size: 14px; }
.side p { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
.side ol { margin: 0; padding-left: 1.4em; font-family: var(--mono); font-size: 13px; }

/* 요구사항 */
.reqs { display: grid; gap: 8px; max-width: 980px; }
.req { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.req .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.req p { margin: 0; color: var(--ink-2); }
.req .by { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
.pill { font-size: 11.5px; padding: 0 7px; border-radius: 999px; background: var(--paper-2); color: var(--ink-2); }
.pill.active { color: var(--add); background: color-mix(in srgb, var(--add) 14%, transparent); }

/* 서랍 */
.scrim { position: fixed; inset: 0; background: rgba(15, 20, 26, .28); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--paper); z-index: 21; box-shadow: var(--shadow); overflow-y: auto; padding: 18px 20px 28px; display: grid; gap: 14px; align-content: start; }
.drawer .head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.drawer h2 { margin: 0; font: 700 18px var(--mono); overflow-wrap: anywhere; }
.drawer .meta { color: var(--ink-3); font-size: 12.5px; }
.close { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-3); font-weight: 600; font-size: 12px; }
td.id, td .id { font-family: var(--mono); }
details { border: 1px solid var(--line); border-radius: 8px; }
summary { cursor: pointer; padding: 6px 10px; font-family: var(--mono); font-size: 12.5px; }
pre { margin: 0; padding: 10px; background: var(--paper-2); border-top: 1px solid var(--line); font: 12px/1.5 var(--mono); overflow-x: auto; max-height: 460px; }
.issuelist { display: grid; gap: 6px; }
.issuelist button { display: flex; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
.issuelist button[disabled] { cursor: default; }
.issuelist .where { color: var(--ink-3); font-size: 11.5px; font-family: var(--mono); overflow-wrap: anywhere; }

@media (max-width: 1100px) { .three, .flowgrid { grid-template-columns: minmax(0, 1fr); } .side { position: static; } }
@media (prefers-reduced-motion: reduce) { .edge { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><b>daemok</b><span id="status">불러오는 중</span></div>
    <nav class="tabs" aria-label="보기">
      <button type="button" data-view="map">지도</button>
      <button type="button" data-view="module">모듈</button>
      <button type="button" data-view="flow">흐름</button>
      <button type="button" data-view="reqs">요구사항</button>
    </nav>
    <button type="button" class="issuesbtn" id="issuesbtn" aria-label="진단 목록 열기"></button>
  </div>
</header>
<main id="main"></main>
<div id="drawer"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const KINDS = {
  depends: { name: '의존', style: '' }, exception: { name: '그룹 예외', style: 'dash' },
  call: { name: 'call 계약', style: '' }, query: { name: 'query', style: '' }, port: { name: 'port', style: '' },
  external: { name: 'external', style: '' }, event: { name: '이벤트', style: 'dash' }, register: { name: '핸들러 등록', style: 'dot' },
};
const COLS = ['reqs', 'actors', 'ifaces', 'exes', 'mods', 'groups', 'members', 'enums', 'consts', 'errors', 'types', 'contracts', 'hks', 'funcs', 'eks', 'events', 'flows'];
const KEYKIND = { reqs: 'req', mods: 'mod', groups: 'grp', members: 'mem', enums: 'enum', consts: 'const', errors: 'err', types: 'type', contracts: 'contract', hks: 'hk', funcs: 'func', eks: 'ek', events: 'ev', flows: 'flow', actors: 'actor', ifaces: 'iface', exes: 'exe' };

let S = null, M = null, B = null, meta = { version: 0 };
let view = 'map', current = '', flowSel = '', flowCompare = '', failAt = '', showAll = false, drawerOpen = null;

function toMaps(v) {
  const m = { ...(v || {}) };
  for (const c of COLS) m[c] = Object.fromEntries(((v || {})[c] || []).map(x => [x.id, x]));
  m.tiers = (v || {}).tiers || [];
  return m;
}
const unitOf = id => (M.members[id] ? M.members[id].group : id);
const unitKind = id => M.mods[id] ? 'mod' : M.groups[id] ? 'grp' : M.members[id] ? 'mem' : '';
const unitNode = id => M.mods[id] || M.groups[id] || M.members[id];
const tierOf = id => { const u = unitNode(id); if (!u) return ''; return u.type === 'mem' ? (M.groups[u.group] || {}).tier : u.tier; };

// 기준(git HEAD) 대비 상태: add, chg, rem, ''
function stOf(col, id) {
  if (!meta.hasBase) return '';
  const a = B[col][id], b = M[col][id];
  if (b && !a) return 'add';
  if (a && !b) return 'rem';
  if (a && b && JSON.stringify(a) !== JSON.stringify(b)) return 'chg';
  return '';
}
const unitSt = id => stOf(M.mods[id] || B.mods[id] ? 'mods' : M.groups[id] || B.groups[id] ? 'groups' : 'members', id);

function issuesFor(keys) { return S.issues.filter(i => keys.includes(i.key)); }
function worst(list) { return list.some(i => i.lv === 'err') ? 'err' : list.some(i => i.lv === 'warn') ? 'warn' : ''; }
function ownedKeys(id) {
  const keys = [unitKind(id) + ':' + id];
  for (const [col, k] of Object.entries(KEYKIND)) for (const n of Object.values(M[col] || {})) if (n.in === id) keys.push(k + ':' + n.id);
  if (M.groups[id]) for (const mid of M.groups[id].members) keys.push(...ownedKeys(mid));
  return keys;
}

/* ---------- 머리 ---------- */
function renderHeader() {
  const t = new Date(S.updated);
  $('#status').textContent = `${S.design} · ${t.toLocaleTimeString()}${S.fatal ? ' · 설계 파일을 읽지 못했다' : ''}${meta.hasBase ? '' : ' · 기준 없음'}`;
  $('#status').className = S.fatal ? 'bad' : '';
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === view)));
  const c = { err: 0, warn: 0, info: 0 };
  S.issues.forEach(i => c[i.lv]++);
  $('#issuesbtn').innerHTML = `진단 <i class="e">오류 ${c.err}</i><i class="w">경고 ${c.warn}</i><i class="n">정보 ${c.info}</i>`;
}

function legend(kinds) {
  return `<div class="legend">${kinds.map(k => `<span class="k-${k}"><span class="sw ${KINDS[k].style}"></span>${KINDS[k].name}</span>`).join('')}</div>`;
}

/* ---------- 지도 ---------- */
const NW = 176, NH = 58, GAP = 22, LEFT = 120, TOP = 20, BAND_PAD = 18;
function mapEdges() {
  const seen = new Set(), out = [];
  for (const r of S.relations) {
    const a = unitOf(r.from), b = unitOf(r.to);
    if (!a || !b || a === b) continue;
    const key = `${a}>${b}>${r.kind}`;
    if (seen.has(key)) { out.find(e => e.key === key).labels.add(r.label); continue; }
    seen.add(key);
    out.push({ key, from: a, to: b, kind: r.kind, labels: new Set(r.label ? [r.label] : []) });
  }
  return out;
}
function renderMap() {
  const units = [...Object.values(M.mods), ...Object.values(M.groups)];
  const tiers = [...M.tiers].reverse();
  const perRow = 6, pos = {};
  let y = TOP, bands = [];
  for (const t of [...tiers, '']) {
    const us = units.filter(u => (u.tier || '') === t);
    if (!us.length) continue;
    const top = y;
    us.forEach((u, i) => { const r = Math.floor(i / perRow), c = i % perRow; pos[u.id] = { x: LEFT + c * (NW + GAP), y: y + BAND_PAD + r * (NH + GAP) }; });
    const rows = Math.ceil(us.length / perRow);
    y += BAND_PAD * 2 + rows * NH + (rows - 1) * GAP;
    bands.push({ t: t || 'tier 없음', y0: top, y1: y });
    y += 14;
  }
  const W = LEFT + perRow * (NW + GAP) + 10, H = Math.max(y, 120);
  const edges = mapEdges().filter(e => pos[e.from] && pos[e.to]);
  let s = `<svg viewBox="0 0 ${W} ${H}" id="mapsvg" role="img" aria-label="모듈 지도">`;
  for (const b of bands) s += `<g class="band"><rect x="0" y="${b.y0}" width="${W}" height="${b.y1 - b.y0}" rx="8"/><text x="14" y="${b.y0 + 22}">${esc(b.t)}</text></g>`;
  const anchor = (p, q) => { const cx = p.x + NW / 2, cy = p.y + NH / 2, tx = q.x + NW / 2, ty = q.y + NH / 2; const dy = ty - cy; return Math.abs(dy) < 4 ? [cx + (tx > cx ? NW / 2 : -NW / 2), cy] : [cx, dy > 0 ? p.y + NH : p.y]; };
  for (const e of edges) {
    const [x1, y1] = anchor(pos[e.from], pos[e.to]), [x2, y2] = anchor(pos[e.to], pos[e.from]);
    const my = (y1 + y2) / 2, d = Math.abs(y2 - y1) < 4 ? `M${x1},${y1} C${(x1 + x2) / 2},${y1 - 40} ${(x1 + x2) / 2},${y2 - 40} ${x2},${y2}` : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    const lbl = [...e.labels].slice(0, 2).join(', ') + (e.labels.size > 2 ? ` 외 ${e.labels.size - 2}` : '');
    s += `<path class="edge k-${e.kind} ${KINDS[e.kind].style}" d="${d}" data-from="${esc(e.from)}" data-to="${esc(e.to)}" marker-end="url(#ar-${e.kind})"/>`;
    if (lbl) s += `<text class="edge-label k-${e.kind}" x="${(x1 + x2) / 2 + 6}" y="${my - 4}" data-from="${esc(e.from)}" data-to="${esc(e.to)}">${esc(lbl)}</text>`;
  }

function fit(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

/* ---------- 모듈 ---------- */

function relRows(list, side) {

  }
  rows.sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || a.other.localeCompare(b.other));

    const labels = r.kind === 'depends' ? '' : r.labels.map(l => labelLink(r.kind, l)).join(' ');
    const why = r.whys.length ? `<span class="why">${esc(r.whys.join(' · '))}</span>` : '';
    return `<div class="rel k-${r.kind}"><div class="top"><span class="kind">${KINDS[r.kind].name}</span>${unitLink(r.other)}</div>${labels ? `<div class="top">${labels}</div>` : ''}${why}</div>`;

}

  addOwned('enums', 'enum', 'enum'); addOwned('consts', 'const', '상수'); addOwned('errors', 'err', '에러'); addOwned('types', 'type', '타입');
  addOwned('contracts', 'contract', '계약'); addOwned('hks', 'hk', '핸들러 종류'); addOwned('eks', 'ek', '이벤트 종류'); addOwned('events', 'ev', '이벤트');

/* ---------- 흐름 ---------- */
function flowHtml(f) {

  const failed = idx >= 0 ? f.steps[idx] : null;
  const undone = new Set(failed ? failed.onFailUndo : []);
  let items = '';
  f.steps.forEach((s, i) => {
    let cls = '';
    if (failed) { if (i === idx) cls = 'failed'; else if (i > idx) cls = 'skipped'; else if (s.undo && undone.has(s.undo)) cls = 'undone'; }
    const tags = [
      s.undo ? `<span class="tag undo">되돌리기 ${esc(s.undo)}</span>` : '',
      s.fatal ? '<span class="tag fatal">실패하면 Fatal</span>' : '',

      ...s.emits.map(e => `<span class="tag emit" data-open="ev:${esc(e)}">발행 ${esc(e)}</span>`),

}
function failPanel(f) {

    return `<button type="button" ${target || 'disabled'}><span class="sev ${i.lv}">${{ err: '오류', warn: '경고', info: '정보' }[i.lv]}</span><span>${esc(i.msg)}<br><span class="where">${esc(where)}</span></span></button>`;
  };
  const sec = (o, title) => { const l = S.issues.filter(i => i.origin === o); return `<div><h3 style="margin:0 0 6px;font-size:13px">${title} ${l.length}</h3><div class="issuelist">${l.map(row).join('') || '<span class="why">없음</span>'}</div></div>`; };
  $('#drawer').innerHTML = `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="진단"><div class="head"><h2>진단</h2><button type="button" class="close" data-close="1">닫기</button></div>${sec('design', '설계 검사')}${sec('code', '코드 대조')}</aside>`;
  $('#drawer .close').focus();
}
function closeDrawer() { drawerOpen = null; $('#drawer').innerHTML = ''; }

/* ---------- 이동 ---------- */
function render() {
  renderHeader();
  ({ map: renderMap, module: renderModule, flow: renderFlow, reqs: renderReqs })[view]();
}
function go(v, arg) {
  view = v;
  if (v === 'module' && arg) current = arg;
  if (v === 'flow' && arg) { flowSel = arg; failAt = ''; }
  closeDrawer();
  const hash = v === 'module' ? `#module/${current}` : v === 'flow' ? `#flow/${flowSel}` : '#' + v;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  render();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-view]'); if (tab) return go(tab.dataset.view);
  if (t.closest('#issuesbtn')) return openIssues();
  if (t.closest('[data-close]')) return closeDrawer();
  const g = t.closest('[data-go]'); if (g) return go('module', g.dataset.go);
  const o = t.closest('[data-open]'); if (o) return openDrawer(o.dataset.open);
  const fl = t.closest('[data-flow]'); if (fl) return go('flow', fl.dataset.flow);
  const fp = t.closest('[data-flowpick]'); if (fp) { flowSel = fp.dataset.flowpick; failAt = ''; return go('flow'); }
  const fc = t.closest('[data-flowcmp]'); if (fc) { flowCompare = flowCompare === fc.dataset.flowcmp ? '' : fc.dataset.flowcmp; return render(); }
  if (t.closest('[data-clearfail]')) { failAt = ''; return render(); }
  const fa = t.closest('[data-fail]'); if (fa) { failAt = failAt === fa.dataset.fail ? '' : fa.dataset.fail; return render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawerOpen) closeDrawer();
  const fa = e.target.closest && e.target.closest('[data-fail]');
  if (fa && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); failAt = failAt === fa.dataset.fail ? '' : fa.dataset.fail; render(); }
});

/* ---------- 서버 상태 ---------- */
async function load() {
  let st;
  try { st = await (await fetch('/api/state', { cache: 'no-store' })).json(); }
  catch (e) { $('#status').textContent = '서버에 연결할 수 없다. daemok serve가 떠 있는지 확인한다'; $('#status').className = 'bad'; return; }
  S = { ...st, issues: st.issues || [], files: st.files || [], relations: st.relations || [] };
  meta = { version: st.version, hasBase: !!st.hasBase };
  M = toMaps(st.model);
  B = st.hasBase ? toMaps(st.base) : M;
  render();
  if (drawerOpen === '#issues') openIssues(); else if (drawerOpen) openDrawer(drawerOpen);
}
{
  const [v, arg] = location.hash.slice(1).split('/');
  if (['map', 'module', 'flow', 'reqs'].includes(v)) { view = v; if (v === 'module') current = decodeURIComponent(arg || ''); if (v === 'flow') flowSel = decodeURIComponent(arg || ''); }
}
const es = new EventSource('/api/events');
es.onmessage = e => { if (+e.data !== meta.version) load(); };
load();
</script>
