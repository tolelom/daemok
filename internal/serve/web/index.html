<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>daemok 설계 지도</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: dark;
  --sans: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #1d2126; --bg-2: #23282e; --bg-3: #2c323a; --rule: #353c45; --rule-2: #4b535e;
  --ink: #e3e7eb; --ink-2: #b3bbc4; --ink-3: #87909b; --accent: #8fb3ec;
  --add: #7cc98f; --chg: #dcb46a; --rem: #ec8b80; --err: #ec8b80; --warn: #dcb46a; --info: #a3b3c6;
  --k-depends: #aab3bd; --k-exception: #dcb46a; --k-call: #62c4d4; --k-query: #8fb3ec;
  --k-port: #7cc98f; --k-external: #bba0f0; --k-event: #e693ba; --k-register: #e09c73;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); }
button, select { font: inherit; color: inherit; }
.id { font-family: var(--mono); font-size: .92em; }
.muted { color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a, .link { color: var(--ink); }

/* 머리 */
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 28px; padding: 0 24px; min-height: 52px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand b { font: 700 16px var(--mono); }
.brand span { color: var(--ink-3); font-size: 13px; overflow-wrap: anywhere; }
.brand span.bad { color: var(--err); }
nav.tabs { display: flex; gap: 22px; align-self: stretch; }
nav.tabs button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.diagbtn { margin-left: auto; border: 0; background: none; cursor: pointer; font-size: 14px; color: var(--ink-3); display: flex; gap: 14px; padding: 4px 0; }
.diagbtn:hover span { text-decoration: underline; text-underline-offset: 3px; }
.diagbtn .e.on { color: var(--err); } .diagbtn .w.on { color: var(--warn); } .diagbtn .n.on { color: var(--info); }
.projbtn { border: 0; background: none; padding: 0; cursor: pointer; font: 600 14px var(--mono); color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.projbtn:hover { color: var(--accent); }
.brand span.modebadge { color: var(--warn); }
.toast { position: fixed; right: 24px; bottom: 24px; z-index: 30; background: var(--bg-3); border: 1px solid var(--rule-2); padding: 10px 14px; border-radius: 6px; font-size: 14px; }
pre.yaml { background: var(--bg-2); border: 1px solid var(--rule); padding: 14px 16px; overflow-x: auto; font: 13px/1.6 var(--mono); }
.draftbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 18px 0 8px; }
.draftbar code { font: 13px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.draftbar button, #openform button { border: 1px solid var(--rule-2); background: var(--bg-3); padding: 4px 12px; border-radius: 4px; cursor: pointer; }
.draftbar button.primary { border-color: var(--accent); color: var(--accent); }
#openform { display: flex; gap: 8px; }
#openform input { flex: 1; min-width: 0; font: 14px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--rule-2); padding: 5px 8px; border-radius: 4px; }
#openerr { color: var(--err); margin: -8px 0 0; min-height: 1.2em; font-size: 13px; }

/* 판 */
.page { display: block; }
.page.with-side { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
#side { display: none; }
.with-side #side { display: block; position: sticky; top: 52px; align-self: start; max-height: calc(100vh - 52px); overflow-y: auto; padding: 22px 12px 40px 20px; border-right: 1px solid var(--rule); }
#side h2 { margin: 18px 0 4px 8px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
#side h2:first-child { margin-top: 0; }
#side ul { list-style: none; margin: 0; padding: 0; }
#side ul ul { margin-left: 14px; border-left: 1px solid var(--rule); padding-left: 4px; }
#side button { display: flex; width: 100%; align-items: baseline; gap: 8px; border: 0; background: none; text-align: left; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-family: var(--mono); font-size: 14px; color: var(--ink-2); }
#side button small { font-family: var(--sans); font-size: 12px; color: var(--ink-3); margin-left: auto; }
#side button:hover { background: var(--bg-2); color: var(--ink); }
#side button[aria-current="true"] { background: var(--bg-3); color: var(--ink); font-weight: 600; }
main { padding: 28px 32px 64px; min-width: 0; max-width: 1400px; }
h1 { margin: 0; font: 700 24px/1.3 var(--mono); overflow-wrap: anywhere; }
h1.plain { font-family: var(--sans); font-size: 20px; }
.sub { margin: 4px 0 0; color: var(--ink-3); font-size: 14px; }
.summary { margin: 12px 0 0; font-size: 16px; max-width: 72ch; }
h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.st { font: 12px var(--sans); }
.st.add { color: var(--add); } .st.chg { color: var(--chg); } .st.rem { color: var(--rem); }

.link { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--mono); font-size: .92em; text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.link:hover { color: var(--accent); text-decoration-color: currentColor; }
.list { display: inline; }
.list > * + *::before { content: ", "; color: var(--ink-3); font-family: var(--sans); text-decoration: none; display: inline-block; white-space: pre; }

.k-depends { --c: var(--k-depends); } .k-exception { --c: var(--k-exception); } .k-call { --c: var(--k-call); }
.k-query { --c: var(--k-query); } .k-port { --c: var(--k-port); } .k-external { --c: var(--k-external); }
.k-event { --c: var(--k-event); } .k-register { --c: var(--k-register); }
.kname { color: var(--c); font-weight: 600; font-size: 14px; }
.legend { display: grid; gap: 2px; font-size: 13px; color: var(--ink-2); }
.legend span { display: flex; align-items: center; gap: 8px; }
.sw { display: inline-block; width: 24px; border-top: 2px solid var(--c); }
.sw.dash { border-top-style: dashed; } .sw.dot { border-top-style: dotted; }

/* 지도 */
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
.map { overflow-x: auto; }
.map svg { display: block; max-width: 100%; height: auto; }
.map text { font-family: var(--sans); }
.band rect { fill: var(--bg-2); }
.band text { fill: var(--ink-3); font-size: 13px; }
.unit { cursor: pointer; }
.unit rect, .unit text, .unit circle { transition: opacity .12s; }
.unit rect.box { fill: var(--bg-3); stroke: var(--rule-2); stroke-width: 1.2; }
.unit rect.stack { fill: var(--bg-2); stroke: var(--rule-2); }
.unit .nm { fill: var(--ink); font: 600 14.5px var(--mono); }
.unit .sb { fill: var(--ink-3); font-size: 12.5px; }
.unit:hover rect.box, .unit:focus rect.box, .unit.on rect.box { stroke: var(--accent); stroke-width: 2; }
.unit.st-add rect.box { stroke: var(--add); stroke-width: 2; } .unit.st-chg rect.box { stroke: var(--chg); stroke-width: 2; }
.unit.st-rem rect.box { stroke: var(--rem); stroke-dasharray: 5 4; } .unit.st-rem .nm { text-decoration: line-through; }
.unit:focus { outline: none; }
.dim .unit:not(.near):not(.on) > * { opacity: .3; }
.edge { fill: none; stroke: var(--c); stroke-width: 1.8; opacity: 0; transition: opacity .12s; }
.edge.show { opacity: .95; }
.edge.dash { stroke-dasharray: 7 5; } .edge.dot { stroke-dasharray: 2 4; }
.edge-label { font-size: 11.5px; paint-order: stroke; stroke: var(--bg-2); stroke-width: 4px; fill: var(--c); opacity: 0; }
.edge-label.show { opacity: 1; }
.issue-dot { r: 4.5; } .issue-dot.err { fill: var(--err); } .issue-dot.warn { fill: var(--warn); }
.panel { position: sticky; top: 80px; display: grid; gap: 14px; font-size: 14px; }
.panel h2 { margin: 0; font: 700 18px var(--mono); }
.panel p { margin: 0; }
.panel .rel p { margin: 2px 0; }
.panel label { display: flex; gap: 8px; align-items: center; color: var(--ink-2); cursor: pointer; }
.panel hr, .rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* 모듈 */
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 24px; margin: 22px 0 0; }
.facts dt { color: var(--ink-3); font-size: 14px; }
.facts dd { margin: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--rule); }
.cols > div > h2 { margin: 0 0 14px; font-size: 16px; }
.kgroup { margin-bottom: 16px; }
.kgroup ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.kgroup li { display: grid; gap: 1px; }
.kgroup p { margin: 4px 0 0; }
.why { color: var(--ink-3); font-size: 14px; }
.labels { font-size: 14px; color: var(--ink-2); }
.diag { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.diag li { display: flex; gap: 10px; }
.sev { flex: none; font-size: 13px; font-weight: 600; }
.sev.err { color: var(--err); } .sev.warn { color: var(--warn); } .sev.info { color: var(--info); }

/* 흐름 */
.flowhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.flowhead label { color: var(--ink-2); font-size: 14px; display: flex; gap: 8px; align-items: center; }
select { background: var(--bg-2); border: 1px solid var(--rule-2); border-radius: 4px; padding: 3px 6px; }
.failnote { margin: 20px 0 0; padding: 10px 14px; background: var(--bg-2); border-left: 3px solid var(--err); max-width: 90ch; }
.failnote p { margin: 0; }
.failnote .clear { border: 0; background: none; color: var(--ink-3); cursor: pointer; text-decoration: underline; padding: 0; margin-left: 10px; font-size: 14px; }
.hint { margin: 20px 0 0; color: var(--ink-3); font-size: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink-3); font-weight: 500; font-size: 13px; }
td.id, td .id { font-family: var(--mono); }
.fgwrap { overflow-x: auto; margin-top: 16px; }
.fg { display: grid; font-size: 14px; min-width: 560px; }
.fg .r { display: contents; }
.fg .c { padding: 7px 10px; border-bottom: 1px solid var(--rule); min-width: 0; overflow-wrap: break-word; }
.fg .r[data-fail] { cursor: pointer; }
.fg .r[data-fail]:hover > .c { background: var(--bg-2); }
.fg .th { color: var(--ink-3); font-size: 13px; padding: 4px 10px 6px; border-bottom: 1px solid var(--rule-2); }
.fg .n { color: var(--ink-3); font: 13px var(--mono); text-align: right; padding-right: 4px; }
.fg .stepbtn { border: 0; background: none; padding: 0; cursor: pointer; font: 600 14px var(--mono); text-align: left; overflow-wrap: anywhere; }
.fg .note { color: var(--ink-3); font-size: 13px; }
.fg .undo { color: var(--k-exception); font-family: var(--mono); font-size: 13.5px; white-space: nowrap; }
.fg .undo.cold { opacity: .4; }
.fg .ord { display: block; color: var(--ink-2); font-size: 12px; }
.fg .fatal { color: var(--err); font-size: 13px; }
.fg .emit { color: var(--k-event); }
.fg .notes { display: grid; gap: 2px; font-size: 13.5px; }
.fg .sect { grid-column: 1 / -1; padding: 12px 10px 6px; color: var(--ink-2); font-size: 13px; border-bottom: 1px solid var(--rule); }
.fg .sidehead { padding: 0 10px 10px; }
.fg .sidehead h2 { margin: 0; font: 700 17px var(--mono); }
.fg .sidehead p { margin: 2px 0 0; color: var(--ink-3); font-size: 13.5px; }
.fg .commitmark { color: var(--add); font-size: 13px; padding: 5px 10px; border-bottom: 2px solid var(--add); }
.fg .failed { background: color-mix(in srgb, var(--err) 16%, transparent); }
.fg .failed.n { color: var(--err); }
.fg .skipped { opacity: .35; }
.ln { position: relative; --lc: var(--k-exception); }
.ln::before, .ln::after { content: none; position: absolute; background: var(--lc); opacity: .6; }
.ln.hot::before, .ln.hot::after { opacity: 1; }
.ln.cold::before, .ln.cold::after { opacity: .18; }
.ln.start::before { content: ""; left: calc(50% - 1px); width: 2px; top: 17px; bottom: 0; }
.ln.mid::before { content: ""; left: calc(50% - 1px); width: 2px; top: 0; bottom: 0; }
.ln.end::before { content: ""; left: calc(50% - 1px); width: 2px; top: 0; height: 19px; }
.ln.start::after, .ln.end::after { content: ""; left: 0; right: 50%; top: 17px; height: 2px; }
.ln.cross::after { content: ""; left: 0; right: 0; top: 17px; height: 2px; }
.ln.hot.start::before, .ln.hot.mid::before, .ln.hot.end::before { width: 3px; }
/* 요구사항 */
.reqs { max-width: 90ch; margin-top: 20px; }
.req { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.req h2 { margin: 0; font: 600 15px var(--mono); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.req h2 small { font: 13px var(--sans); color: var(--ink-3); }
.req h2 small.active { color: var(--add); }
.req p { margin: 4px 0 0; }
.req .by { font-size: 14px; color: var(--ink-3); }

/* 서랍 */
.scrim { position: fixed; inset: 0; background: rgba(8, 10, 13, .55); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--bg-2); border-left: 1px solid var(--rule-2); z-index: 21; overflow-y: auto; padding: 22px 24px 32px; display: grid; gap: 16px; align-content: start; }
.drawer .head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.drawer h2 { margin: 0; font: 700 19px var(--mono); overflow-wrap: anywhere; }
.drawer .meta { color: var(--ink-3); font-size: 14px; margin-top: 2px; }
.drawer p { margin: 0; }
.close { border: 1px solid var(--rule-2); background: none; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 14px; }
.close:hover { border-color: var(--ink-3); }
details { border-top: 1px solid var(--rule); }
summary { cursor: pointer; padding: 8px 0; font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
pre { margin: 0 0 8px; padding: 12px; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; font: 12.5px/1.55 var(--mono); overflow-x: auto; max-height: 480px; }
.issuelist { display: grid; }
.issuelist button { display: flex; gap: 10px; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 8px 0; cursor: pointer; font-size: 14px; }
.issuelist button:hover:not([disabled]) { background: var(--bg-3); }
.issuelist button[disabled] { cursor: default; }
.issuelist .where { color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); overflow-wrap: anywhere; }

@media (max-width: 1000px) {
  .mapwrap, .cols, .flows.two { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
}
@media (max-width: 760px) {
  .bar { padding: 6px 16px; }
  .page.with-side { grid-template-columns: minmax(0, 1fr); }
  .with-side #side { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); padding: 12px 16px; }
  main { padding: 20px 16px 48px; }
  .diagbtn { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .edge, .unit > * { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><b>daemok</b><button type="button" class="projbtn" id="projbtn" aria-label="프로젝트 열기"></button><span id="modebadge" class="modebadge" hidden>분석 모드 · 설계 파일 없음</span><span id="status">불러오는 중</span></div>
    <nav class="tabs" aria-label="보기">
      <button type="button" data-view="map">지도</button>
      <button type="button" data-view="module">모듈</button>
      <button type="button" data-view="flow">흐름</button>
      <button type="button" data-view="reqs">요구사항</button>
      <button type="button" data-view="draft" hidden>초안</button>
    </nav>
    <button type="button" class="diagbtn" id="issuesbtn" aria-label="진단 목록 열기"></button>
  </div>
</header>
<div class="page" id="page"><aside id="side"></aside><main id="main"></main></div>
<div id="drawer"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const KINDS = {
  depends: { name: '의존', style: '' }, exception: { name: '그룹 예외', style: 'dash' },
  call: { name: 'call 계약', style: '' }, query: { name: 'query', style: '' }, port: { name: 'port', style: '' },
  external: { name: 'external', style: '' }, event: { name: '이벤트', style: 'dash' }, register: { name: '핸들러 등록', style: 'dot' },
};
const SEV = { err: '오류', warn: '경고', info: '정보' };
const ST = { add: '추가', chg: '수정', rem: '삭제' };
const COLS = ['reqs', 'actors', 'ifaces', 'exes', 'mods', 'groups', 'members', 'enums', 'consts', 'errors', 'types', 'contracts', 'hks', 'funcs', 'eks', 'events', 'flows'];
const KEYKIND = { reqs: 'req', mods: 'mod', groups: 'grp', members: 'mem', enums: 'enum', consts: 'const', errors: 'err', types: 'type', contracts: 'contract', hks: 'hk', funcs: 'func', eks: 'ek', events: 'ev', flows: 'flow', actors: 'actor', ifaces: 'iface', exes: 'exe' };

let S = null, M = null, B = null, meta = { version: 0 };
let view = 'map', current = '', flowSel = '', flowCompare = '', failAt = '', showAll = false, drawerOpen = null, mapFocus = '';

function toMaps(v) {
  const m = { ...(v || {}) };
  for (const c of COLS) m[c] = Object.fromEntries(((v || {})[c] || []).map(x => [x.id, x]));
  m.tiers = (v || {}).tiers || [];
  return m;
}
const unitOf = id => (M.members[id] ? M.members[id].group : id);
const unitKind = id => M.mods[id] ? 'mod' : M.groups[id] ? 'grp' : M.members[id] ? 'mem' : '';
const unitNode = id => M.mods[id] || M.groups[id] || M.members[id];
const tierOf = id => { const u = unitNode(id); if (!u) return ''; return u.type === 'mem' ? (M.groups[u.group] || {}).tier : u.tier; };
const topUnits = () => [...Object.values(M.mods), ...Object.values(M.groups)];
const tiersTopDown = () => [...M.tiers].reverse().concat(['']);

// 기준(git HEAD) 대비 상태: add, chg, rem, ''
function stOf(col, id) {
  if (!meta.hasBase) return '';
  const a = B[col][id], b = M[col][id];
  if (b && !a) return 'add';
  if (a && !b) return 'rem';
  if (a && b && JSON.stringify(a) !== JSON.stringify(b)) return 'chg';
  return '';
}
const unitSt = id => stOf(M.mods[id] || B.mods[id] ? 'mods' : M.groups[id] || B.groups[id] ? 'groups' : 'members', id);
const stMark = st => st ? ` <span class="st ${st}">${ST[st]}</span>` : '';

function issuesFor(keys) { return S.issues.filter(i => keys.includes(i.key)); }
function worst(list) { return list.some(i => i.lv === 'err') ? 'err' : list.some(i => i.lv === 'warn') ? 'warn' : ''; }
function ownedKeys(id) {
  const keys = [unitKind(id) + ':' + id];
  for (const [col, k] of Object.entries(KEYKIND)) for (const n of Object.values(M[col] || {})) if (n.in === id) keys.push(k + ':' + n.id);
  if (M.groups[id]) for (const mid of M.groups[id].members) keys.push(...ownedKeys(mid));
  return keys;
}
const diagList = iss => `<ul class="diag">${iss.map(i => `<li><span class="sev ${i.lv}">${SEV[i.lv]}</span><span>${esc(i.msg)}</span></li>`).join('')}</ul>`;
const inlineList = items => `<span class="list">${items.join('')}</span>`;

function unitLink(id) { return unitNode(id) ? `<button type="button" class="link" data-go="${esc(id)}">${esc(id)}</button>` : `<span class="id">${esc(id)}</span>`; }
function nodeLink(k, id) {
  if (['mod', 'grp', 'mem'].includes(k)) return unitLink(id);
  if (k === 'flow') return `<button type="button" class="link" data-flow="${esc(id)}">${esc(id)}</button>`;
  return `<button type="button" class="link" data-open="${k}:${esc(id)}">${esc(id)}</button>`;
}
function labelLink(kind, label) {
  if (kind === 'event' && M.events[label]) return nodeLink('ev', label);
  if (M.contracts[label]) return nodeLink('contract', label);
  if (kind === 'register' && M.hks[label]) return nodeLink('hk', label);

/* ---------- 흐름 ---------- */
// 두 흐름의 단계를 같은 이름끼리 같은 행에 놓는다(LCS). 한쪽에만 있는 단계는 다른 쪽이 빈칸이다.
function alignSteps(flows) {
  if (flows.length === 1) return flows[0].steps.map((_, i) => [i]);
  const a = flows[0].steps.map(x => x.id), b = flows[1].steps.map(x => x.id);
  const L = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (i < a.length && j < b.length && a[i] === b[j]) out.push([i++, j++]);
    else if (j >= b.length || (i < a.length && L[i + 1][j] >= L[i][j + 1])) out.push([i++, null]);
    else out.push([null, j++]);

  return out;
}
// 되돌리기 괄호: 되돌리기를 등록한 단계에서 커밋 단계(커밋이 없으면 마지막 단계)까지. 안쪽 괄호가 단계 이름에 가깝다.

  const ci = f.steps.findIndex(x => x.commit);
  const last = ci >= 0 ? ci : f.steps.length - 1;
  const fi = f.steps.findIndex(x => x.id === failAt);
  const failed = fi >= 0 ? f.steps[fi] : null;
  const order = failed ? failed.onFailUndo : [];
  const lanes = f.steps.map((st, i) => ({ st, i })).filter(x => x.st.undo && x.i < (ci >= 0 ? ci : f.steps.length))
    .map(x => {
      const hot = !!failed && x.i < fi && order.includes(x.st.undo);
      return { name: x.st.undo, i: x.i, start: rowOf[x.i], end: rowOf[last], hot, cold: !!failed && !hot, ord: order.indexOf(x.st.undo) + 1 };

  if (flowCompare && (!M.flows[flowCompare] || flowCompare === flowSel)) flowCompare = '';
  setSide(`<h2>흐름</h2><ul>${flows.map(f => `<li><button type="button" data-flowpick="${esc(f.id)}" aria-current="${f.id === flowSel}">${esc(f.id)}<small>${esc(f.in)}</small></button></li>`).join('')}</ul>`);
  const f = M.flows[flowSel], shown = [f, ...(flowCompare ? [M.flows[flowCompare]] : [])];
  const failFlow = shown.find(x => x.steps.some(s => s.id === failAt));
  const cmp = flows.length > 1 ? `<label>나란히 비교 <select id="cmp"><option value="">비교 안 함</option>${flows.filter(x => x.id !== flowSel).map(x => `<option value="${esc(x.id)}" ${x.id === flowCompare ? 'selected' : ''}>${esc(x.id)}</option>`).join('')}</select></label>` : '';
  const head = x => `<p class="sub">${unitLink(x.in)} 모듈, 단계 ${x.steps.length}${x.on ? `, 시작 이벤트 <span class="id">${esc(x.on)}</span>` : ''}</p>${x.summary ? `<p class="summary">${esc(x.summary)}</p>` : ''}`;
  const body = flowGrid(shown);
  $('#main').innerHTML = `<div class="flowhead"><div>${flowCompare ? '<h1 class="plain">흐름 비교</h1>' : `<h1>${esc(flowSel)}</h1>${head(f)}`}</div>${cmp}</div>${failNote(failFlow)}${body}`;
  const sel = $('#cmp');
  if (sel) sel.addEventListener('change', e => { flowCompare = e.target.value; render(); });
}

/* ---------- 요구사항 ---------- */
function renderReqs() {
  setSide('');
  const reqs = Object.values(M.reqs);
  const by = {};
  for (const [col, k] of Object.entries(KEYKIND)) for (const n of Object.values(M[col] || {})) for (const r of n.satisfies || []) (by[r] = by[r] || []).push([k, n.id]);
  $('#main').innerHTML = `<h1 class="plain">요구사항</h1><div class="reqs">${reqs.length ? reqs.map(r => {
    const iss = issuesFor(['req:' + r.id]);
    return `<section class="req"><h2>${esc(r.id)}<small class="${r.status === 'active' ? 'active' : ''}">${esc(r.status)}</small></h2><p>${esc(r.text)}</p><p class="by">${by[r.id] ? `충족: ${inlineList(by[r.id].map(([k, id]) => nodeLink(k, id)))}` : '연결된 설계 요소 없음'}</p>${iss.length ? diagList(iss) : ''}</section>`;
  }).join('') : '<p class="muted">설계에 요구사항이 없다.</p>'}</div>`;
}

/* ---------- 서랍 ---------- */
function filesFor(key) { return S.files.filter(f => f.sources.includes(key)); }
function codeBlocks(key) { return filesFor(key).map(f => `<details><summary>${esc(f.path)}</summary><pre>${esc(f.code)}</pre></details>`).join(''); }
function fieldsTable(fields) {
  if (!fields.length) return '<p class="muted">필드 없음</p>';
  return `<table><thead><tr><th>필드</th><th>타입</th><th>제약</th></tr></thead><tbody>${fields.map(f => `<tr><td class="id">${esc(f.name)}</td><td class="id">${esc(f.ref ? (f.many ? '[]' : '*') + f.ref : (f.many ? '[]' : '') + f.type)}</td><td>${[f.optional ? 'optional' : '', f.max ? 'max ' + f.max : ''].filter(Boolean).join(', ') || '-'}</td></tr>`).join('')}</tbody></table>`;
}
const factRows = rows => `<dl class="facts" style="margin:0">${rows.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>`;
function drawerBody(key) {
  const [k, ...rest] = key.split(':'), id = rest.join(':');
  const col = Object.keys(KEYKIND).find(c => KEYKIND[c] === k), n = col ? M[col][id] : null;
  if (!n) return null;
  let metaLine = '', body = '';
  if (k === 'contract') {
    metaLine = `${esc(n.kind)} 계약, ${unitLink(n.in)} 모듈`;
    const users = [...new Set(S.relations.filter(r => r.label === id && r.kind === n.kind).map(r => r.from))];
    body = `<table><thead><tr><th>메서드</th><th>파라미터</th><th>반환</th><th>에러</th></tr></thead><tbody>${n.methods.map(me => `<tr><td class="id">${esc(me.name)}</td><td class="id">${me.params.map(p => esc(p.name + ' ' + p.type)).join('<br>') || '-'}</td><td class="id">${esc(me.returns.join(', ') || '-')}</td><td class="id">${esc(me.errors.join(', ') || '-')}</td></tr>`).join('')}</tbody></table>
      ${factRows([['받는 쪽', users.length ? inlineList(users.map(unitLink)) : '<span class="muted">없음</span>']])}`;
  } else if (k === 'ev') {
    const ek = M.eks[n.kind] || {};
    metaLine = `이벤트, 종류 <span class="id">${esc(n.kind)}</span>, ${unitLink(ek.in)} 모듈`;
    const subs = [...new Set([...n.subscribers, ...(ek.subscribers || [])])];
    body = `${factRows([['발행', inlineList(n.publishers.map(unitLink))], ['구독', subs.length ? inlineList(subs.map(unitLink)) : '<span class="muted">없음</span>']])}${fieldsTable(n.data)}`;
  } else if (k === 'ek') {
    metaLine = `이벤트 종류, ${unitLink(n.in)} 모듈, 키 <span class="id">${esc(n.key)}</span>, ${esc(n.encoding)}`;
    body = factRows([['이벤트', inlineList(Object.values(M.events).filter(e => e.kind === id).map(e => nodeLink('ev', e.id)))]]);
  } else if (k === 'type') {
    metaLine = `타입, ${unitLink(n.in)} 모듈`; body = fieldsTable(n.fields);
  } else if (k === 'enum') {
    metaLine = `enum, ${unitLink(n.in)} 모듈`; body = `<p>${inlineList(n.values.map(v => `<span class="id">${esc(v)}</span>`))}</p>`;
  } else if (k === 'err') {
    metaLine = `에러, ${unitLink(n.in)} 모듈`; body = `<p>${esc(n.message)}${n.http ? `  (HTTP ${n.http})` : ''}</p>`;
  } else if (k === 'const') {
    metaLine = `상수, ${unitLink(n.in)} 모듈`; body = `<p class="id">${esc(n.value)} (${esc(n.type)})</p>`;
  } else if (k === 'hk') {
    metaLine = `핸들러 종류, ${unitLink(n.in)} 모듈, 키 <span class="id">${esc(n.key)}</span>`; body = `<p class="id">func(${esc(n.params.map(p => p.name + ' ' + p.type).join(', '))}) ${esc(n.returns.join(', '))}</p>`;
  } else if (k === 'func') {
    metaLine = `함수, ${unitLink(n.in)} 모듈`;
    body = `<table><thead><tr><th>케이스</th><th>주어진 상태</th><th>기대</th></tr></thead><tbody>${n.cases.map(c => `<tr><td>${esc(c.name)}</td><td class="id">${esc(JSON.stringify(c.given))}</td><td class="id">${esc(c.error || JSON.stringify(c.expect))}</td></tr>`).join('')}</tbody></table>`;
  } else metaLine = esc(k);
  const iss = issuesFor([key]);
  const files = codeBlocks(key);
  return `<div class="head"><div><h2>${esc(id)}</h2><div class="meta">${metaLine}</div></div><button type="button" class="close" data-close="1">닫기</button></div>${n.summary ? `<p>${esc(n.summary)}</p>` : ''}${body}${iss.length ? diagList(iss) : ''}${files ? `<div><h3>생성 코드</h3>${files}</div>` : ''}`;
}
function openDrawer(key) {
  const body = drawerBody(key);
  if (!body) return;
  drawerOpen = key;
  $('#drawer').innerHTML = `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="${esc(key)}">${body}</aside>`;
  $('#drawer .close').focus();
}
function openIssues() {
  drawerOpen = '#issues';
  const row = i => {
    const target = i.key && (['mod', 'grp', 'mem'].includes(i.key.split(':')[0]) ? `data-go="${esc(i.key.split(':').slice(1).join(':'))}"` : `data-open="${esc(i.key)}"`);
    const where = i.file ? `${i.file}${i.line ? ':' + i.line : ''}` : '';
    return `<button type="button" ${target || 'disabled'}><span class="sev ${i.lv}">${SEV[i.lv]}</span><span>${esc(i.msg)}${where ? `<br><span class="where">${esc(where)}</span>` : ''}</span></button>`;
  };
  const sec = (o, title) => { const l = S.issues.filter(i => i.origin === o); return `<div><h3>${title} ${l.length}</h3><div class="issuelist">${l.map(row).join('') || '<span class="muted">없음</span>'}</div></div>`; };
  $('#drawer').innerHTML = `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="진단"><div class="head"><h2>진단</h2><button type="button" class="close" data-close="1">닫기</button></div>${sec('design', '설계 검사')}${sec('code', '코드 대조')}</aside>`;
  $('#drawer .close').focus();
}
function closeDrawer() { drawerOpen = null; $('#drawer').innerHTML = ''; }

/* ---------- 초안 ---------- */
function renderDraft() {
  setSide('');
  const d = S.draft, r = d.report;
  const skipped = (r.skipped || []).map(x => `<li><span class="id">${esc(x.path)}</span> <span class="muted">${esc(x.reason)}</span></li>`).join('') || '<li class="muted">없음</li>';
  const fan = (r.fanIn || []).map(x => `${unitLink(x.id)} ${x.count}`).join(', ') || '<span class="muted">없음</span>';
  const cycles = (r.cycles || []).map(c => `<li>${c.map(unitLink).join(', ')}</li>`).join('');
  $('#main').innerHTML = `<h1 class="plain">초안</h1>
<p class="sub">설계 파일이 없어 코드의 패키지와 import에서 추정했다. tier 이름과 묶음은 사람이 정한다.</p>
<dl class="facts"><dt>패키지</dt><dd>${r.packages}</dd><dt>모듈</dt><dd>${r.modules}</dd><dt>실행 단위</dt><dd>${r.executables}</dd><dt>많이 쓰이는 패키지</dt><dd>${fan}</dd></dl>
${cycles ? `<h3 style="margin-top:22px">서로 import하는 패키지</h3><ul>${cycles}</ul>` : ''}
<h3 style="margin-top:22px">건너뛴 것</h3><ul>${skipped}</ul>
<div class="draftbar"><button type="button" class="primary" id="savedraft">design/에 저장</button><code>${esc(d.command)}</code><button type="button" id="copycmd">명령 복사</button></div>
<p id="savemsg" class="muted"></p>
<pre class="yaml">${esc(d.yaml)}</pre>`;
}

/* ---------- 프로젝트 ---------- */
let autoOpened = false;
async function post(url, body) {
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json().catch(() => ({}));
    return r.ok ? { ok: true, ...j } : { ok: false, error: j.error || `요청이 거부되었다 (${r.status})` };
  } catch (e) { return { ok: false, error: '서버에 연결할 수 없다' }; }
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}
async function openProjects() {
  drawerOpen = '#projects';
  let p = { recent: [], workspace: [], canOpen: false };
  try { p = await (await fetch('/api/projects', { cache: 'no-store' })).json(); } catch (e) {}
  const item = (path, ok) => `<button type="button" data-openpath="${esc(path)}" ${ok ? '' : 'disabled'}><span class="id">${esc(path)}</span></button>`;
  const form = p.canOpen
    ? `<form id="openform"><input id="openpath" type="text" placeholder="E:\\dev\\projects\\tolchain" autocomplete="off" spellcheck="false" aria-label="프로젝트 경로"><button type="submit">열기</button></form><p id="openerr"></p>`
    : `<p class="muted">루프백이 아닌 주소로 띄워서 프로젝트를 열 수 없다</p>`;
  $('#drawer').innerHTML = `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="프로젝트 열기"><div class="head"><h2>프로젝트 열기</h2><button type="button" class="close" data-close="1">닫기</button></div>
${form}
<div><h3>최근</h3><div class="issuelist">${p.recent.map(x => item(x.path, x.exists && p.canOpen)).join('') || '<span class="muted">없음</span>'}</div></div>
${p.workspace.length ? `<div><h3>작업 폴더</h3><div class="issuelist">${p.workspace.map(x => item(x, p.canOpen)).join('')}</div></div>` : ''}
</aside>`;
  ($('#openpath') || $('#drawer .close')).focus();
}
async function openProject(path) {
  const res = await post('/api/open', { path });
  if (!res.ok) { const e = $('#openerr'); if (e) e.textContent = res.error; else toast(res.error); return; }
  closeDrawer();
  view = 'map'; current = ''; flowSel = ''; flowCompare = ''; failAt = ''; mapFocus = '';
  history.replaceState(null, '', '#map');
  await load();
}
async function saveDraft() {
  const btn = $('#savedraft'); if (btn) btn.disabled = true;
  const res = await post('/api/init', {});
  if (!res.ok) { $('#savemsg').textContent = res.error; if (btn) btn.disabled = false; return; }
  toast(`${res.path}을 만들었다`);
  await load();
}

/* ---------- 이동 ---------- */
const VIEWS = { check: ['map', 'module', 'flow', 'reqs'], analyze: ['map', 'module', 'draft'], none: [] };
function render() {
  if (!(VIEWS[S.mode] || VIEWS.check).includes(view)) view = 'map';
  renderHeader();
  if (S.mode === 'none') { setSide(''); $('#main').innerHTML = `<p class="muted">열 프로젝트를 고른다. 설계 파일(design/*.yaml)이나 go.mod가 있는 폴더를 연다.</p>`; return; }
  ({ map: renderMap, module: renderModule, flow: renderFlow, reqs: renderReqs, draft: renderDraft })[view]();
}
function go(v, arg) {
  view = v;
  if (v === 'module' && arg) current = arg;
  if (v === 'flow' && arg) { flowSel = arg; failAt = ''; }
  closeDrawer();
  const hash = v === 'module' ? `#module/${current}` : v === 'flow' ? `#flow/${flowSel}` : '#' + v;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  render();
  window.scrollTo(0, 0);
}
const toggleFail = id => { failAt = failAt === id ? '' : id; render(); };
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#projbtn')) return openProjects();
  const op = t.closest('[data-openpath]'); if (op) return openProject(op.dataset.openpath);
  if (t.closest('#savedraft')) return saveDraft();
  if (t.closest('#copycmd')) { navigator.clipboard.writeText(S.draft.command).then(() => toast('명령을 복사했다'), () => toast('복사할 수 없다')); return; }
  const tab = t.closest('[data-view]'); if (tab) return go(tab.dataset.view);
  if (t.closest('#issuesbtn')) return openIssues();
  if (t.closest('[data-close]')) return closeDrawer();
  const g = t.closest('[data-go]'); if (g) return go('module', g.dataset.go);
  const o = t.closest('[data-open]'); if (o) return openDrawer(o.dataset.open);
  const fl = t.closest('[data-flow]'); if (fl) return go('flow', fl.dataset.flow);
  const fp = t.closest('[data-flowpick]'); if (fp) { flowSel = fp.dataset.flowpick; failAt = ''; return go('flow'); }
  if (t.closest('[data-clearfail]')) { failAt = ''; return render(); }
  const fa = t.closest('[data-fail]'); if (fa) return toggleFail(fa.dataset.fail);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'openform') return;
  e.preventDefault();
  openProject($('#openpath').value.trim());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drawerOpen) closeDrawer();
});

/* ---------- 서버 상태 ---------- */
async function load() {
  let st;
  try { st = await (await fetch('/api/state', { cache: 'no-store' })).json(); }
  catch (e) { $('#status').textContent = '서버에 연결할 수 없다. daemok serve가 떠 있는지 확인한다'; $('#status').className = 'bad'; return; }
  S = { ...st, issues: st.issues || [], files: st.files || [], relations: st.relations || [] };
  meta = { version: st.version, hasBase: !!st.hasBase };
  M = toMaps(st.model);
  B = st.hasBase ? toMaps(st.base) : M;
  render();
  if (drawerOpen === '#issues') openIssues(); else if (drawerOpen && drawerOpen[0] !== '#') openDrawer(drawerOpen);
  if (S.mode === 'none' && !autoOpened) { autoOpened = true; openProjects(); }
}
{
  const [v, arg] = location.hash.slice(1).split('/');
  if (['map', 'module', 'flow', 'reqs', 'draft'].includes(v)) { view = v; if (v === 'module') current = decodeURIComponent(arg || ''); if (v === 'flow') flowSel = decodeURIComponent(arg || ''); }
}
const es = new EventSource('/api/events');
es.onmessage = e => { if (+e.data !== meta.version) load(); };
load();
</script>
</body>
</html>
